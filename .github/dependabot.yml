---
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
    labels: ["dependencies", "npm"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # AI-SDK majors break the live-agent path (streamText/fullStream shapes) — handled in a
      # deliberate migration PR, not an auto-bump. See #185.
      - dependency-name: "ai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@ai-sdk/openai"
        update-types: ["version-update:semver-major"]
      # @a2ui/react is 0.x, so a breaking renderer/protocol redesign (the v0.9 rewrite — no
      # onAction/provider/registry, evaluated & deferred in #140) can ship as a 0.x MINOR, not a
      # major. Ignore both so it's a deliberate migration PR, not an auto-bump (same rationale as
      # the AI-SDK above). Patch bumps still flow — CI's real-renderer test guards them.
      - dependency-name: "@a2ui/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # typescript-eslint peer-caps TypeScript at <6.1.0, so a TS major auto-bump makes `npm ci`
      # unresolvable (ERESOLVE) and reds CI + the Pages deploy — exactly what the 7.0.2 bump did.
      # Let TS majors land in a deliberate PR once typescript-eslint supports them.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
    labels: ["dependencies", "npm"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Same TypeScript cap as /ui — typescript-eslint peers at <6.1.0, so a TS major auto-bump
      # breaks `npm ci` here too.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # NOTE: @cloudflare/workers-types majors are NOT ignored any more — wrangler >=4.110 peers on
      # ^5, so pinning it at ^4 was itself the ERESOLVE. Keep it tracking wrangler's peer.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore(ci)"
...
