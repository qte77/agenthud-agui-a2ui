---
name: tag-release

# Auto-tag vX.Y.Z when ui/package.json's version changes on main.
on:
  push:
    branches: [main]
    paths: ["ui/package.json"]

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - name: Tag on version bump
        run: |
          set -euo pipefail
          NEW="$(node -p "require('./ui/package.json').version")"
          OLD="$(git show HEAD^:ui/package.json 2>/dev/null \
            | node -e "try{process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).version)}catch(e){}" || true)"
          if [ "$NEW" = "$OLD" ]; then
            echo "No version change (still $NEW) — nothing to tag."
            exit 0
          fi
          if ! [[ "$NEW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$NEW' in ui/package.json (expected X.Y.Z)"
            exit 1
          fi
          TAG="v$NEW"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Tagged $TAG"
