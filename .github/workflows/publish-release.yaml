---
name: publish-release

# Cut a GitHub Release from the matching CHANGELOG block. Tag-only is the default
# flow; run this when you also want a published Release with notes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.0). Defaults to the latest v* tag."
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Create GitHub Release from CHANGELOG
        env:
          # Untrusted dispatch input — kept in env and regex-validated before use, never
          # interpolated into the shell directly.
          TAG_INPUT: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${TAG_INPUT:-$(git tag --list 'v*' --sort=-v:refname | head -n1)}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid or missing tag '$TAG' (expected vX.Y.Z)"
            exit 1
          fi
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          NOTES="$(VER="${TAG#v}" node -e '
            const fs = require("fs");
            const ver = (process.env.VER || "").replace(/\./g, "\\.");
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split("\n");
            let out = [], flag = false;
            for (const l of lines) {
              if (new RegExp("^## \\[" + ver + "\\]").test(l)) { flag = true; continue; }
              if (flag && /^## \[/.test(l)) break;
              if (flag) out.push(l);
            }
            process.stdout.write(out.join("\n").trim());
          ')"
          if [ -z "$NOTES" ]; then
            echo "No CHANGELOG entry for $TAG — using auto-generated notes."
            gh release create "$TAG" --title "$TAG" --generate-notes
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          fi
          echo "Published release $TAG"
