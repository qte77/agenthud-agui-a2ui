<!doctype html>
<html lang="en">
  <head>
    <script>
      // Anti-FOUC: theme before first paint (ported from qte77 ui-kit/anti-fouc.html).
      // Precedence: ?theme= › localStorage["qte77-theme"] › system (no attribute).
      (function () {
        try {
          var url = new URLSearchParams(location.search).get("theme");
          var ls = localStorage.getItem("qte77-theme");
          var m = [url, ls].find(function (v) {
            return v === "light" || v === "dark" || v === "system";
          });
          if (m === "light" || m === "dark")
            document.documentElement.setAttribute("data-theme", m);
          else document.documentElement.removeAttribute("data-theme");
        } catch (e) {
          /* private mode / storage disabled — non-fatal */
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>agenthud</title>
    <meta
      name="description"
      content="AG-UI event replay + A2UI component rendering in a static Vite/React app: different user intents compose different UI layouts from one standard A2UI catalog."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
