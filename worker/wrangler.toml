# BYOK pass-through CORS proxy (US-6). Holds no secret — forwards the visitor's key.
# Deploy: `wrangler deploy`, then set PROXY_BASE in ui/src/config.ts to the
# resulting https://agenthud-proxy.<your-subdomain>.workers.dev URL. See README.md.
name = "agenthud-proxy"
main = "src/worker.ts"
# Pinned to the date the LOCAL `wrangler dev` runtime (workerd) supports — "today" can exceed the
# installed wrangler's binary and break `wrangler dev`. Bump alongside wrangler upgrades.
compatibility_date = "2026-06-24"

# Declare workers.dev routing so a clean `wrangler deploy` is deterministic (this was the manual
# go-live gotcha). preview_urls off keeps the public surface to the single canonical hostname.
workers_dev = true
preview_urls = false

# Logs + traces on for debugging + spotting abuse (low-traffic proxy -> sample everything).
[observability]
enabled = true

  [observability.logs]
  enabled = true
  head_sampling_rate = 1
  invocation_logs = true

  [observability.traces]
  enabled = true

# Per-IP rate limit (abuse lock) — 100 requests / 60s per client IP. Eventually-consistent and
# per-location; enough to throttle relay farming without blocking real users. Production only
# (named envs don't inherit bindings; the worker treats it as optional, so dev/tests skip it).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 100
  period = 60

# Cloudflare Workers AI (free, no key) — the first, truly-$0 tier of the keyless `/agent/render`
# free chain (spares the OpenRouter quota). Secrets (OPENROUTER_KEY, TURNSTILE_SECRET) are set with
# `wrangler secret put`, NOT here.
[ai]
binding = "AI"

# Tighter per-IP limit for the SERVER-funded keyless render endpoint — 10 requests / 60s per IP
# (the 100/60s above is sized for the BYOK relay). Production only; the handler treats it as optional.
[[ratelimits]]
name = "FREE_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60

# Production (`wrangler deploy`) sets no vars, so CORS echoes ONLY https://qte77.github.io.
# The dev deploy (`wrangler deploy --env dev` -> agenthud-proxy-dev) additionally allows
# localhost origins, for headless/local E2E. For local `wrangler dev`, put
# ALLOW_LOCALHOST="true" in a gitignored worker/.dev.vars instead.
[env.dev.vars]
ALLOW_LOCALHOST = "true"

# Named envs don't inherit bindings — mirror the AI binding so the dev deploy (agenthud-proxy-dev,
# used for headless E2E) exercises the full free chain. FREE_RATE_LIMITER stays prod-only (like
# RATE_LIMITER above); the handler skips it when absent, leaving local/E2E runs unthrottled.
[env.dev.ai]
binding = "AI"
