# BYOK pass-through CORS proxy (US-6). Holds no secret — forwards the visitor's key.
# Served at https://agenthud-api.abizz.dev, a Custom Domain attached to this Worker in the Cloudflare
# dashboard (Worker > Domains); ui/src/config.ts's PROXY_BASE points at it. See README.md.
name = "agenthud-proxy"
main = "src/worker.ts"
# Pinned to the date the LOCAL `wrangler dev` runtime (workerd) supports — "today" can exceed the
# installed wrangler's binary and break `wrangler dev`. Bump alongside wrangler upgrades.
compatibility_date = "2026-06-24"
# nodejs_compat: the MCP server SDK (@modelcontextprotocol/server) pulls in Node built-ins.
compatibility_flags = ["nodejs_compat"]

# No *.workers.dev URL and no preview URLs: they expose the Cloudflare account name, and the custom
# domain above is the only public hostname. Both must be set here — a dashboard-only switch-off is
# undone by the next `wrangler deploy`.
workers_dev = false
preview_urls = false

# Logs + traces on for debugging + spotting abuse (low-traffic proxy -> sample everything).
[observability]
enabled = true

  [observability.logs]
  enabled = true
  head_sampling_rate = 1
  invocation_logs = true

  [observability.traces]
  enabled = true

# Per-IP rate limit (abuse lock) — 100 requests / 60s per client IP. Eventually-consistent and
# per-location; enough to throttle relay farming without blocking real users. Production only
# (named envs don't inherit bindings; the worker treats it as optional, so dev/tests skip it).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 100
  period = 60

# Cloudflare Workers AI (free, no key) — the first, truly-$0 tier of the keyless `/agent/render`
# free chain (spares the OpenRouter quota). Secrets (OPENROUTER_KEY, TURNSTILE_SECRET) are set with
# `wrangler secret put`, NOT here.
[ai]
binding = "AI"

# Tighter per-IP limit for the SERVER-funded keyless render endpoint — 10 requests / 60s per IP
# (the 100/60s above is sized for the BYOK relay). Production only; the handler treats it as optional.
[[ratelimits]]
name = "FREE_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60

# Trial tier (spend-bearing, `/agent/trial-render`): a hard per-visitor + shared-daily cap, not a
# sliding window (the RateLimit binding above tops out at a 60s period — useless for "3 uses ever"
# or "N/day"). TrialQuotaDO is exported from worker.ts (wrangler resolves class_name against the
# main script's exports). See ADR-0006.
[[durable_objects.bindings]]
name = "TRIAL_DO"
class_name = "TrialQuotaDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TrialQuotaDO"]

# Production (`wrangler deploy`) sets no vars, so CORS echoes ONLY https://qte77.github.io.
# For local/headless E2E, run `wrangler dev` with ALLOW_LOCALHOST="true" in a gitignored
# worker/.dev.vars (see README.md "Local dev"). There is no deployed dev Worker.
